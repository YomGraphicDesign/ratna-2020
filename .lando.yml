name: ratna
recipe: drupal8
config:
  webroot: htdocs
  conf:
    php: config/php.ini
  drush: path:/app/vendor/bin/drush
  
  pma:
    - pma.ratna.lndo.site
services:
  appserver:
    overrides:
        environment:
          PHP_IDE_COFIG: "servername=ratna.lndo.site"
    
    
  # Add a phpmyadmin db frontend
  pma:

    # Use the latest version of phpmyadmin
    type: phpmyadmin

    # The databases you want to look at, this will default to a service called
    # "database"
    #
    # You might want to run `lando info` on your app to see what databases you
    # have available
    hosts:
      - database