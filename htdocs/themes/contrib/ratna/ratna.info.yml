core_version_requirement: ^9 || ^10 || ^11
type: theme
base theme: bootstrap

name: 'Ratna'
description: 'A Drupal Bootstrap 3 based sub-theme.'
package: 'Bootstrap'

regions:
  navigation: 'Navigation'
  navigation_collapsible: 'Navigation (Collapsible)'
  header: 'Top Bar'
  highlighted: 'Highlighted'
  help: 'Help'
  content: 'Content'
  sidebar_first: 'Primary'
  sidebar_second: 'Secondary'
  footer: 'Footer'
  page_top: 'Page top'
  page_bottom: 'Page bottom'

libraries-extend:
  bootstrap/framework:
    - ratna/framework

# Désactive le pont Bootstrap↔jQuery UI dialog (modal.jquery.ui.bridge.js),
# cassé sous jQuery 4. Les œuvres utilisent le dialog natif du core, stylé via
# .oeuvre-modal — ce pont n'est pas nécessaire.
libraries-override:
  bootstrap/modal.jquery.ui.bridge: false
